<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WANTED · 纯手绘通缉令生成器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #1a1a1a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #d4d4d4;
        }

        /* 画布容器：使用双层 Canvas */
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        /* 底层：背景与蛛网图 */
        #bgCanvas {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* 顶层：手写涂鸦层 */
        #drawCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            touch-action: none; /* 阻止屏幕滑动 */
            cursor: crosshair;
        }

        /* 底部控制面板 */
        .control-panel {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            background: #2a2a2a;
            border-top: 2px solid #333;
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }
        
        .mode-selector {
            display: flex;
            justify-content: space-between;
            background: #1e1e1e;
            border-radius: 8px;
            padding: 5px;
        }
        .mode-selector label {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            color: #999;
            font-size: 15px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .mode-selector input[type="radio"] {
            display: none;
        }
        .mode-selector input[type="radio"]:checked + span {
            color: #fff;
            font-weight: bold;
        }
        .mode-selector label:has(input[type="radio"]:checked) {
            background: #8b3a30;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }
        button:active {
            opacity: 0.8;
        }
        .btn-clear {
            background: #444;
            color: #fff;
        }
        .btn-generate {
            background: #8b3a30;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <!-- 背景与雷达图层 -->
        <canvas id="bgCanvas"></canvas>
        <!-- 手绘涂鸦层 (置于顶层接收事件) -->
        <canvas id="drawCanvas"></canvas>
    </div>

    <div class="control-panel">
        <div class="mode-selector">
            <label>
                <input type="radio" name="mode" value="radar" checked>
                <span>🕸️ 调整蛛网</span>
            </label>
            <label>
                <input type="radio" name="mode" value="draw">
                <span>✍️ 手写文字</span>
            </label>
        </div>

        <div class="btn-group">
            <button class="btn-clear" onclick="clearDrawing()">清空手写</button>
            <button class="btn-generate" onclick="downloadPoster()">保存图片</button>
        </div>
    </div>

    <script>
        const bgCanvas = document.getElementById('bgCanvas');
        const drawCanvas = document.getElementById('drawCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        const drawCtx = drawCanvas.getContext('2d');

        // ==== 配置参数 ====
        const CONFIG = {
            bgSrc: '7853b6a44ae0169c8597e955aed39a1.jpg',
            // 修正后的雷达中心点和半径 (根据底图比例计算)
            radarCenterX: 0.505, 
            radarCenterY: 0.528, 
            radarMaxRadius: 0.25, // 缩小了最大半径，防止溢出最外层网格
            
            radarFillColor: 'rgba(119, 44, 34, 0.7)',
            radarStrokeColor: 'rgba(70, 20, 15, 0.8)',
            
            // 手绘笔刷配置
            penColor: '#4a1f16',
            penWidthRatio: 0.008 // 笔刷粗细随图片分辨率缩放
        };

        // 7个维度的值 (0-5档)
        let values = [3, 2, 4, 2, 3, 3, 2]; 
        let currentMode = 'radar'; // 'radar' 或 'draw'

        const bgImage = new Image();
        bgImage.src = CONFIG.bgSrc;
        bgImage.onload = () => {
            // 初始化两个画布的实际分辨率
            bgCanvas.width = bgImage.naturalWidth;
            bgCanvas.height = bgImage.naturalHeight;
            drawCanvas.width = bgImage.naturalWidth;
            drawCanvas.height = bgImage.naturalHeight;
            
            // 设置手绘笔刷样式
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.strokeStyle = CONFIG.penColor;
            drawCtx.lineWidth = drawCanvas.width * CONFIG.penWidthRatio;

            drawRadarLayer();
        };

        // ==== 模式切换监听 ====
        document.querySelectorAll('input[name="mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentMode = e.target.value;
            });
        });

        // ==== 绘制底层：背景 + 蛛网 ====
        function drawRadarLayer() {
            if (!bgImage.complete) return;

            bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.drawImage(bgImage, 0, 0, bgCanvas.width, bgCanvas.height);

            const cx = bgCanvas.width * CONFIG.radarCenterX;
            const cy = bgCanvas.height * CONFIG.radarCenterY;
            const maxR = bgCanvas.width * CONFIG.radarMaxRadius;

            bgCtx.beginPath();
            for (let i = 0; i < 7; i++) {
                const angle = -Math.PI / 2 + (i * 2 * Math.PI / 7);
                const r = maxR * (values[i] / 5);
                const x = cx + r * Math.cos(angle);
                const y = cy + r * Math.sin(angle);
                
                if (i === 0) bgCtx.moveTo(x, y);
                else bgCtx.lineTo(x, y);
            }
            bgCtx.closePath();
            
            bgCtx.fillStyle = CONFIG.radarFillColor;
            bgCtx.fill();
            bgCtx.lineWidth = bgCanvas.width * 0.005;
            bgCtx.strokeStyle = CONFIG.radarStrokeColor;
            bgCtx.stroke();
        }

        // ==== 交互逻辑获取真实坐标 ====
        function getPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            const scaleX = drawCanvas.width / rect.width;
            const scaleY = drawCanvas.height / rect.height;
            
            let clientX = e.clientX;
            let clientY = e.clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        // ==== 统一的事件处理机制 ====
        let isInteracting = false;
        let lastDrawPos = null;

        function handleStart(e) {
            e.preventDefault();
            isInteracting = true;
            const pos = getPos(e);
            
            if (currentMode === 'radar') {
                updateRadar(pos.x, pos.y);
            } else if (currentMode === 'draw') {
                lastDrawPos = pos;
                drawCtx.beginPath();
                drawCtx.moveTo(pos.x, pos.y);
                drawCtx.lineTo(pos.x, pos.y); // 画一个点
                drawCtx.stroke();
            }
        }

        function handleMove(e) {
            if (!isInteracting) return;
            e.preventDefault();
            const pos = getPos(e);

            if (currentMode === 'radar') {
                updateRadar(pos.x, pos.y);
            } else if (currentMode === 'draw') {
                if (lastDrawPos) {
                    drawCtx.beginPath();
                    drawCtx.moveTo(lastDrawPos.x, lastDrawPos.y);
                    drawCtx.lineTo(pos.x, pos.y);
                    drawCtx.stroke();
                    lastDrawPos = pos;
                }
            }
        }

        function handleEnd(e) {
            isInteracting = false;
            lastDrawPos = null;
        }

        // 计算蛛网维度逻辑
        function updateRadar(x, y) {
            const cx = bgCanvas.width * CONFIG.radarCenterX;
            const cy = bgCanvas.height * CONFIG.radarCenterY;
            const maxR = bgCanvas.width * CONFIG.radarMaxRadius;

            const dx = x - cx;
            const dy = y - cy;
            let angle = Math.atan2(dy, dx) + Math.PI / 2;
            if (angle < 0) angle += Math.PI * 2;

            const segment = (Math.PI * 2) / 7;
            const axisIndex = Math.round(angle / segment) % 7;

            const distance = Math.sqrt(dx * dx + dy * dy);
            // 将档位严格限制在 0 - 5 之间，避免溢出
            let val = Math.round((distance / maxR) * 5);
            val = Math.max(0, Math.min(5, val)); 

            values[axisIndex] = val;
            drawRadarLayer(); // 重绘底层
        }

        // 绑定事件到顶层的 drawCanvas
        drawCanvas.addEventListener('mousedown', handleStart);
        drawCanvas.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', handleEnd);

        drawCanvas.addEventListener('touchstart', handleStart, {passive: false});
        drawCanvas.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchend', handleEnd);

        // ==== 清空手写 ====
        function clearDrawing() {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        }

        // ==== 合并图层并保存图片 ====
        function downloadPoster() {
            // 创建一个临时画布用于合并
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = bgCanvas.width;
            tempCanvas.height = bgCanvas.height;
            const tCtx = tempCanvas.getContext('2d');

            // 依次画入底层和涂鸦层
            tCtx.drawImage(bgCanvas, 0, 0);
            tCtx.drawImage(drawCanvas, 0, 0);

            // 导出并下载
            const dataURL = tempCanvas.toDataURL('image/jpeg', 0.9);
            const link = document.createElement('a');
            link.download = `WANTED_Poster_${new Date().getTime()}.jpg`;
            link.href = dataURL;
            link.click();
        }
    </script>
</body>
</html>
