<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANTED · 手绘生成器</title>
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; }
        .canvas-container { position: relative; width: 100%; max-width: 500px; }
        #bgCanvas, #drawCanvas { width: 100%; display: block; }
        #drawCanvas { position: absolute; top: 0; left: 0; touch-action: none; }
        .toolbar { display: flex; gap: 10px; padding: 20px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

<div class="canvas-container">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
</div>

<div class="toolbar">
    <button onclick="setMode('pen')">🖊️ 钢笔</button>
    <button onclick="setMode('marker')">🖍️ 涂色</button>
    <button onclick="clearAll()" style="background:#8b3a30; color:#fff;">清空</button>
</div>

<script>
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const ctx = drawCanvas.getContext('2d');
    let mode = 'pen';
    let drawing = false;

    // 初始化图片
    const img = new Image();
    img.crossOrigin = "anonymous"; // 尝试绕过 CORS
    img.src = '7853b6a44ae0169c8597e955aed39a1.jpg';
    img.onload = () => {
        bgCanvas.width = drawCanvas.width = img.naturalWidth;
        bgCanvas.height = drawCanvas.height = img.naturalHeight;
        bgCanvas.getContext('2d').drawImage(img, 0, 0);
    };

    function setMode(m) { mode = m; }

    // 绘制逻辑
    drawCanvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
    drawCanvas.onmousemove = (e) => {
        if (!drawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.lineWidth = (mode === 'pen') ? 5 : 40;
        ctx.strokeStyle = (mode === 'pen') ? '#4a1f16' : 'rgba(119, 44, 34, 0.5)';
        ctx.lineCap = 'round';
        ctx.stroke();
    };
    drawCanvas.onmouseup = () => { drawing = false; };

    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (drawCanvas.width/rect.width), 
                 y: (e.clientY - rect.top) * (drawCanvas.height/rect.height) };
    }

    function clearAll() { ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); }
</script>
</body>
</html>
