<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WANTED · 手绘生成器</title>
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; color: #fff; font-family: sans-serif; }
        .canvas-container { position: relative; width: 100%; max-width: 500px; }
        #bgCanvas, #drawCanvas { width: 100%; display: block; }
        #drawCanvas { position: absolute; top: 0; left: 0; touch-action: none; cursor: crosshair; }
        .toolbar { display: flex; gap: 12px; padding: 15px; flex-wrap: wrap; justify-content: center; align-items: center; background: #2a2a2a; width: 100%; max-width: 500px; box-sizing: border-box; }
        button { padding: 10px 16px; cursor: pointer; border-radius: 6px; border: none; background: #444; color: #fff; font-weight: bold; }
        button.active { background: #8b3a30; }
        .slider-group { display: flex; align-items: center; gap: 8px; font-size: 14px; }
        input[type="range"] { cursor: pointer; }
    </style>
</head>
<body>

<div class="canvas-container">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
</div>

<div class="toolbar">
    <button id="btn-pen" class="active" onclick="setMode('pen')">🖊️ 钢笔</button>
    <button id="btn-marker" onclick="setMode('marker')">🖍️ 涂色</button>
    
    <div class="slider-group">
        <label for="opacityRange">透明度:</label>
        <input type="range" id="opacityRange" min="0.1" max="1.0" step="0.05" value="0.35">
    </div>

    <button onclick="clearAll()" style="background:#8b3a30;">清空</button>
    <button onclick="download()" style="background:#555;">保存</button>
</div>

<script>
    const bgCanvas = document.getElementById('bgCanvas');
    const drawCanvas = document.getElementById('drawCanvas');
    const ctx = drawCanvas.getContext('2d');
    let mode = 'pen';
    let drawing = false;

    // 初始化图片
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.src = '7853b6a44ae0169c8597e955aed39a1.jpg';
    img.onload = () => {
        bgCanvas.width = drawCanvas.width = img.naturalWidth;
        bgCanvas.height = drawCanvas.height = img.naturalHeight;
        bgCanvas.getContext('2d').drawImage(img, 0, 0);
    };

    function setMode(m) { 
        mode = m; 
        document.querySelectorAll('button').forEach(b => {
            if(b.id === 'btn-pen' || b.id === 'btn-marker') b.classList.remove('active');
        });
        document.getElementById('btn-' + m).classList.add('active');
    }

    // 绘制逻辑
    drawCanvas.onmousedown = (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(getPos(e).x, getPos(e).y); };
    drawCanvas.onmousemove = (e) => {
        if (!drawing) return;
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        
        // 获取当前滑块的透明度值
        const alpha = document.getElementById('opacityRange').value;

        if (mode === 'pen') {
            ctx.lineWidth = 5;
            // 钢笔也带上透明度，或者保持深色。这里让钢笔跟随透明度或保持浓郁复古色
            ctx.strokeStyle = `rgba(74, 31, 22, ${Math.max(alpha, 0.8)})`; 
        } else {
            ctx.lineWidth = 40; // 涂色笔刷较粗
            ctx.strokeStyle = `rgba(119, 44, 34, ${alpha})`; // 涂色使用滑块控制的透明度
        }

        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
    };
    drawCanvas.onmouseup = () => { drawing = false; };

    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (drawCanvas.width/rect.width), 
                 y: (e.clientY - rect.top) * (drawCanvas.height/rect.height) };
    }

    function clearAll() { ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height); }

    function download() {
        const temp = document.createElement('canvas');
        temp.width = drawCanvas.width; temp.height = drawCanvas.height;
        const tCtx = temp.getContext('2d');
        tCtx.drawImage(bgCanvas, 0, 0);
        tCtx.drawImage(drawCanvas, 0, 0);
        const a = document.createElement('a');
        a.href = temp.toDataURL('image/jpeg', 0.9);
        a.download = 'WANTED_Custom.jpg';
        a.click();
    }
</script>
</body>
</html>
