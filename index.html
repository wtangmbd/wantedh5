<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WANTED · 自动填充通缉令</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background-color: #1a1a1a; display: flex; flex-direction: column; align-items: center; min-height: 100vh; color: #fff; }
        .canvas-container { position: relative; width: 100%; max-width: 500px; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #bgCanvas, #drawCanvas { display: block; width: 100%; height: auto; }
        #drawCanvas { position: absolute; top: 0; left: 0; touch-action: none; cursor: crosshair; }
        .panel { width: 100%; max-width: 500px; padding: 15px; background: #2a2a2a; display: flex; flex-direction: column; gap: 10px; }
        .tools { display: flex; gap: 5px; background: #111; padding: 5px; border-radius: 8px; }
        .tool-btn { flex: 1; padding: 10px; text-align: center; background: #333; color: #aaa; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .tool-btn.active { background: #8b3a30; color: #fff; font-weight: bold; }
        .hint { font-size: 12px; color: #888; text-align: center; }
    </style>
</head>
<body>

<div class="canvas-container">
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
</div>

<div class="panel">
    <div class="tools" id="toolBox">
        <div class="tool-btn active" data-tool="pen">🖊️ 钢笔</div>
        <div class="tool-btn" data-tool="marker">🖍️ 涂色</div>
        <div class="tool-btn" data-tool="fill" title="闭合区域内双击自动填充">💧 填充</div>
        <div class="tool-btn" data-tool="eraser">🧽 擦除</div>
    </div>
    <div class="hint">"涂色"模式画轮廓，"填充"模式下双击区域内自动填色</div>
    <button style="padding:12px; background:#8b3a30; border:none; color:#fff; border-radius:6px;" onclick="download()">保存通缉令</button>
</div>

<script>
    const bgCanvas = document.getElementById('bgCanvas'), drawCanvas = document.getElementById('drawCanvas');
    const bgCtx = bgCanvas.getContext('2d'), drawCtx = drawCanvas.getContext('2d');
    let currentTool = 'pen';

    const bgImage = new Image();
    bgImage.src = '7853b6a44ae0169c8597e955aed39a1.jpg';
    bgImage.onload = () => {
        bgCanvas.width = drawCanvas.width = bgImage.naturalWidth;
        bgCanvas.height = drawCanvas.height = bgImage.naturalHeight;
        bgCtx.drawImage(bgImage, 0, 0);
    };

    // 工具切换
    document.getElementById('toolBox').addEventListener('click', e => {
        if(!e.target.dataset.tool) return;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTool = e.target.dataset.tool;
    });

    // 洪水填充算法 (Flood Fill)
    function floodFill(x, y, fillColor) {
        const imgData = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
        const data = imgData.data;
        const targetColor = getPixel(imgData, x, y);
        
        // 简单防溢出检查
        if (targetColor[0] === 119 && targetColor[1] === 44 && targetColor[2] === 34) return;

        const stack = [[x, y]];
        while(stack.length) {
            let [px, py] = stack.pop();
            let pos = (py * drawCanvas.width + px) * 4;
            if(data[pos+3] === 0) { // 仅填充透明区域
                data[pos] = 119; data[pos+1] = 44; data[pos+2] = 34; data[pos+3] = 180;
                stack.push([px+1, py], [px-1, py], [px, py+1], [px, py-1]);
            }
        }
        drawCtx.putImageData(imgData, 0, 0);
    }

    function getPixel(imgData, x, y) {
        let i = (y * imgData.width + x) * 4;
        return [imgData.data[i], imgData.data[i+1], imgData.data[i+2], imgData.data[i+3]];
    }

    // 绘图逻辑
    let drawing = false, lastPos = null;
    drawCanvas.addEventListener('mousedown', e => {
        const pos = getPos(e);
        if(currentTool === 'fill') {
            floodFill(pos.x, pos.y);
        } else {
            drawing = true; lastPos = pos;
        }
    });
    drawCanvas.addEventListener('mousemove', e => {
        if(!drawing) return;
        const pos = getPos(e);
        drawCtx.beginPath();
        drawCtx.lineWidth = currentTool === 'pen' ? 5 : 20;
        drawCtx.strokeStyle = currentTool === 'eraser' ? 'rgba(0,0,0,1)' : 'rgba(119,44,34,0.8)';
        drawCtx.globalCompositeOperation = currentTool === 'eraser' ? 'destination-out' : 'source-over';
        drawCtx.moveTo(lastPos.x, lastPos.y);
        drawCtx.lineTo(pos.x, pos.y);
        drawCtx.stroke();
        lastPos = pos;
    });
    window.addEventListener('mouseup', () => drawing = false);

    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        return { x: Math.floor((e.clientX - rect.left) * (drawCanvas.width/rect.width)), 
                 y: Math.floor((e.clientY - rect.top) * (drawCanvas.height/rect.height)) };
    }

    function download() {
        const final = document.createElement('canvas');
        final.width = bgCanvas.width; final.height = bgCanvas.height;
        const ctx = final.getContext('2d');
        ctx.drawImage(bgCanvas, 0, 0);
        ctx.drawImage(drawCanvas, 0, 0);
        const a = document.createElement('a');
        a.href = final.toDataURL();
        a.download = 'wanted.jpg';
        a.click();
    }
</script>
</body>
</html>
